<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IdP Registration</title>
        <link rel="stylesheet" href="/style.css">
    </head>

    <body>
        <a class="top-link" href="/">Home</a>
        <main>
            <section class="panel">
                <h1>IdP Registration</h1>
                <p class="helper-text">Create a local identity provider account.</p>

                <form action="/register" method="post">
                    <label for="name">Full name</label>
                    <input type="text" id="name" name="name" autocomplete="name" required>

                    <label for="username">Preferred username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email">

                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate" name="birthdate" autocomplete="bday" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>

                    <button type="submit">Register</button>
                </form>
            </section>
        </main>
    </body>
</html>
