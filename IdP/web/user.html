<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>IdP User</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <a class="top-link" href="/">Home</a>
        <main>
            <section class="panel">
                <h1>User profile</h1>
                <p class="helper-text">The preferred username can be changed here. Authorized services receive the updated value on their next claims request.</p>

                <div class="profile-grid">
                    <div class="profile-item"><strong>Full name</strong><span>{{name}}</span></div>
                    <div class="profile-item"><strong>Email</strong><span>{{email}}</span></div>
                    <div class="profile-item"><strong>Birthdate</strong><span>{{birthdate}}</span></div>
                </div>

                <form class="profile-form" action="/user/update" method="post">
                    <label for="username">Preferred username</label>
                    <input id="username" name="username" type="text" value="{{username}}" autocomplete="username" required>
                    <button type="submit">Save username</button>
                </form>

                <form class="logout-form" action="/logout" method="post">
                    <button class="logout-button" type="submit">Log out</button>
                </form>
            </section>
        </main>
    </body>
</html>
