<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DIDSSO</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <p>DIDSSO</p>
      <h1>Firefox Wallet</h1>
    </header>

    <section class="panel">
      <label for="did-name">Alias</label>
      <input id="did-name" type="text" autocomplete="off" placeholder="e.g.: RP Demo, Master DID, Pairwise">

      <div class="actions">
        <button id="create-did" type="button">Create DID</button>
      </div>

      <label for="did-list">Your DIDs</label>
      <select id="did-list"></select>
      <div class="actions">
        <button id="copy-did" type="button">Copy DID</button>
      </div>


      <p id="status" role="status"></p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
