<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RP Login</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <a class="admin-link" href="/admin">Admin</a>
    <main>
        <section class="login-panel">
            <h1>RP Login</h1>
            <p class="helper-text">Use Privacy-Enhanced SSO to authorize access. On later visits, DID Login uses your existing DID and retrieves your latest profile data without another registration proof.</p>

            <button id="sso-start-button" type="button" class="sso-button">Privacy-Enhanced SSO</button>
            <button id="did-login-button" type="button" class="secondary-button">DID Login</button>
            <p class="helper-text" id="login-status" role="status" hidden></p>
        </section>
    </main>

    <script>
        const ssoButton = document.getElementById("sso-start-button");
        const didLoginButton = document.getElementById("did-login-button");
        const loginStatus = document.getElementById("login-status");

        async function startLogin(path, pendingMessage, failureMessage, destination) {
            ssoButton.disabled = true;
            didLoginButton.disabled = true;
            loginStatus.hidden = false;
            loginStatus.textContent = pendingMessage;

            try {
                const response = await fetch("http://127.0.0.1:8771" + path, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: "{}",
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || failureMessage);
                }
                const url = destination(data);
                if (!url) {
                    throw new Error("The RP backend did not return a login destination.");
                }
                window.location.href = url;
            } catch (error) {
                loginStatus.textContent = error.message;
                ssoButton.disabled = false;
                didLoginButton.disabled = false;
            }
        }

        ssoButton.addEventListener("click", () => startLogin(
            "/sso/start",
            "Starting Privacy-Enhanced SSO...",
            "Privacy-Enhanced SSO could not be started.",
            data => data.authorization_request_url,
        ));
        didLoginButton.addEventListener("click", () => startLogin(
            "/did-login/start",
            "Sending DID challenge...",
            "DID login failed.",
            data => data.session_id
                ? `/sso/wait?session_id=${encodeURIComponent(data.session_id)}`
                : null,
        ));
    </script>
</body>
</html>
